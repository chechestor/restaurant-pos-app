name: Android debug APK

on:
  push:
    branches: [main, dev]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0 platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: chmod +x ./gradlew && ./gradlew assembleDebug --stacktrace

      - name: Name the APK for this branch
        id: apk
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            name=smgpos
          else
            name=smgposdev
          fi
          rm -rf packed
          mkdir packed
          cp app/build/outputs/apk/debug/app-debug.apk "packed/${name}.apk"
          cp scripts/install.ps1 packed/install.ps1
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: packed/
          if-no-files-found: error
